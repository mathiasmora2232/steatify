# Production stack. PostgreSQL and Redis are provided by the existing VPS infrastructure.
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: shopdb-postgres
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: shopdb-redis
      REDIS_URL: ${REDIS_URL}
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - default
      - steatify-infra
    depends_on:
      ml-service:
        condition: service_started

  ml-service:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    restart: unless-stopped
    env_file: .env
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:4000}
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:4000}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
    depends_on:
      - backend

  # Túnel de Cloudflare: publica steatify.lat (y www., app., auth., admin.) hacia el frontend y api.steatify.lat hacia el backend.
  # Los hostnames y sus destinos (http://frontend:3000, http://backend:4000) se administran en Cloudflare (Zero Trust → Tunnels → steatify);
  # aquí solo corre el conector con el token del túnel, que va en el .env del servidor (el deploy lo copia del secreto CLOUDFLARE_TUNNEL_TOKEN).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Define TUNNEL_TOKEN en el .env del servidor (token del túnel steatify de Cloudflare)}
    networks:
      - default
    depends_on:
      - frontend
      - backend

networks:
  steatify-infra:
    external: true
    name: steatify-infra
