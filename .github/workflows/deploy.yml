name: Sonora CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=backend

      - name: Backend tests
        run: npm test --workspace=backend

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -eu
            cd "${{ secrets.VPS_APP_DIR }}"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker network inspect sonora-infra >/dev/null 2>&1 || docker network create sonora-infra
            docker network connect sonora-infra shopdb-postgres >/dev/null 2>&1 || true
            docker network connect sonora-infra shopdb-redis >/dev/null 2>&1 || true
            bash scripts/vps-init-sonora-db.sh
            docker compose -f docker-compose.prod.yml config >/dev/null
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
                echo "Sonora backend is healthy"
                exit 0
              fi
              sleep 5
            done

            docker compose -f docker-compose.prod.yml logs --tail=100 backend
            exit 1
