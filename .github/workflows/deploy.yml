name: Steatify CI/CD

on:
  push:
    branches:
      - main
      - dev
      - production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=backend

      - name: Backend tests
        run: npm test --workspace=backend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

  deploy:
    # Solo production despliega, tambien al lanzarlo a mano (workflow_dispatch desde otra rama no despliega)
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    # A nivel de job: asi los tests de main/dev/PR no comparten grupo ni pueden cancelar un deploy en cola
    concurrency:
      group: steatify-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out the release commit on the server
        uses: appleboy/ssh-action@v1.1.0
        env:
          REPO_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22022' }}
          envs: REPO_TOKEN
          script: |
            set -eu
            # Embebido directo (no por `envs:`): esta VPS no acepta SendEnv de variables custom por SSH (AcceptEnv),
            # así que una variable pasada solo por `envs:` llegaba vacía al script remoto.
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            ORIGIN=https://github.com/mathiasmora2232/steatify.git
            if [ "$APP_DIR" != "/opt/steatify" ]; then
              echo "VPS_APP_DIR must be /opt/steatify; refusing an unexpected deployment target" >&2
              exit 1
            fi
            if [ ! -d "$APP_DIR" ]; then
              echo "Deployment directory does not exist: $APP_DIR" >&2
              exit 1
            fi
            if [ -e "$APP_DIR/.git" ]; then
              TOP="$(git -C "$APP_DIR" rev-parse --show-toplevel 2>/dev/null || true)"
              CURRENT_ORIGIN="$(git -C "$APP_DIR" remote get-url origin 2>/dev/null || true)"
              if [ "$TOP" != "$APP_DIR" ] || [ "$CURRENT_ORIGIN" != "$ORIGIN" ]; then
                echo "Existing Git metadata does not match the Steatify repository; refusing to alter it" >&2
                exit 1
              fi
            else
              git -C "$APP_DIR" init -b main
              git -C "$APP_DIR" remote add origin "$ORIGIN"
            fi
            if [ -z "${REPO_TOKEN:-}" ]; then
              echo "GitHub Actions token is unavailable; cannot clone the private repository" >&2
              exit 1
            fi
            ASKPASS_DIR="$(mktemp -d)"
            trap 'rm -f "$ASKPASS_DIR/askpass"; rmdir "$ASKPASS_DIR"' EXIT
            ASKPASS="$ASKPASS_DIR/askpass"
            printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *Password*) printf "%s\n" "$GITHUB_REPO_TOKEN" ;; *) exit 1 ;; esac' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            # El commit exacto que disparo el workflow (production), no la punta de main.
            # checkout -f tambien borra los archivos que el release elimino; .env y demas ignorados se conservan.
            DEPLOY_SHA="${{ github.sha }}"
            GITHUB_REPO_TOKEN="$REPO_TOKEN" GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git -C "$APP_DIR" fetch --depth=1 origin "$DEPLOY_SHA"
            git -C "$APP_DIR" checkout -f -B production FETCH_HEAD
            test "$(git -C "$APP_DIR" rev-parse HEAD)" = "$DEPLOY_SHA"
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "Git checkout is ready, but $APP_DIR/.env is missing; deploy stopped before Docker changes" >&2
              exit 1
            fi

      - name: Deploy
        uses: appleboy/ssh-action@v1.1.0
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22022' }}
          envs: TUNNEL_TOKEN,SPOTIFY_CLIENT_SECRET
          command_timeout: 30m
          script: |
            set -eu
            # Igual que en el paso anterior: embebido directo, no por `envs:` (esta VPS no acepta SendEnv de variables custom por SSH).
            APP_DIR="${{ secrets.VPS_APP_DIR }}"

            test -f "$APP_DIR/.env" || { echo "Missing production .env; refusing deployment" >&2; exit 1; }
            # Secretos que se guardan como secretos de GitHub: si existen, se dejan en el .env del servidor (sin imprimirlos)
            upsert() {
              [ -n "$2" ] || return 0
              grep -v "^$1=" "$APP_DIR/.env" > "$APP_DIR/.env.new" || true
              printf '%s=%s\n' "$1" "$2" >> "$APP_DIR/.env.new"
              chmod 600 "$APP_DIR/.env.new" && mv "$APP_DIR/.env.new" "$APP_DIR/.env"
            }
            upsert TUNNEL_TOKEN "${TUNNEL_TOKEN:-}"
            upsert SPOTIFY_CLIENT_SECRET "${SPOTIFY_CLIENT_SECRET:-}"
            # docker compose prioriza el entorno del shell sobre el .env: si el secreto de GitHub
            # no existe, estas variables quedan exportadas vacias y pisan el valor bueno que recien
            # escribimos en el .env. Las quitamos del entorno para forzar a compose a leer el .env.
            unset TUNNEL_TOKEN SPOTIFY_CLIENT_SECRET
            cd "$APP_DIR"
            test -f docker-compose.prod.yml
            test -f scripts/vps-init-steatify-db.sh

            docker network inspect steatify-infra >/dev/null 2>&1 || docker network create steatify-infra
            docker network connect steatify-infra shopdb-postgres >/dev/null 2>&1 || true
            docker network connect steatify-infra shopdb-redis >/dev/null 2>&1 || true
            bash scripts/vps-init-steatify-db.sh
            docker compose -f docker-compose.prod.yml config >/dev/null
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
                echo "Steatify backend is healthy"
                exit 0
              fi
              sleep 5
            done

            docker compose -f docker-compose.prod.yml logs --tail=100 backend
            exit 1
